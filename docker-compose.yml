# Avvio completo: database, server, video live e sito con HTTPS.
# Uso: copia .env.example in .env, compila i valori, poi `docker compose up -d --build`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stl
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: stl
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stl"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://stl:${DB_PASSWORD}@db:5432/stl
      JWT_SECRET: ${JWT_SECRET}
      # Proprietario e amministratori iniziali: nessuno diventa admin perché si iscrive per primo.
      OWNER_EMAIL: ${OWNER_EMAIL:-francescodimichele@gmail.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-lorenzogiustarini@gmail.com}
      UPLOAD_DIR: /data/uploads
      # Il server parla a LiveKit dentro Docker; i telefoni usano l'indirizzo pubblico.
      # Con LiveKit Cloud (quando le porte del router non si aprono) basta scrivere LIVEKIT_CLOUD_URL nel file .env.
      LIVEKIT_URL: ${LIVEKIT_CLOUD_URL:-ws://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_CLOUD_URL:-wss://${LIVE_DOMAIN}}
      # Codice di prova per iscriversi finché la casella email non è impostata. Cambialo nel .env.
      ACCESS_TEST_CODE: ${ACCESS_TEST_CODE:-123456}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      PUBLIC_URL: https://${DOMAIN}
      BACKUP_DIR: /backups
      RECORDINGS: ${RECORDINGS:-true}
      RECORDINGS_DIR: /data/recordings
    volumes:
      - uploads:/data/uploads
      - recordings:/data/recordings
      - ./backups:/backups:ro

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    depends_on: [redis]
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  # Collegamento interno tra il server video e il servizio che registra le Piazze.
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Registrazione delle Piazze: guarda la Piazza come uno spettatore e salva un MP4 a griglia.
  # Usa parecchio processore mentre registra (circa 2 core per Piazza registrata).
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    depends_on: [livekit, redis]
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        log_level: info
    volumes:
      - recordings:/out

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api, livekit]
    environment:
      DOMAIN: ${DOMAIN}
      LIVE_DOMAIN: ${LIVE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

  # Backup automatico: database e foto/video nella cartella "backups" accanto a questo file.
  # Il primo parte subito, poi ogni notte alle 3. I database più vecchi di 14 giorni si cancellano da soli.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: stl
      PGDATABASE: stl
      PGPASSWORD: ${DB_PASSWORD}
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
      BACKUP_HOUR: "3"
      KEEP_DAYS: "14"
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads:/data/uploads:ro

  # Facoltativo: tiene aggiornato l'indirizzo gratuito DuckDNS se l'IP di casa cambia.
  # Si accende solo con:  docker compose --profile duckdns up -d
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    profiles: ["duckdns"]
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      TZ: Europe/Rome

volumes:
  db-data:
  uploads:
  recordings:
  caddy-data:
