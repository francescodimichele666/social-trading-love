# Avvio completo: database, server, video live e sito con HTTPS.
# Uso: copia .env.example in .env, compila i valori, poi `docker compose up -d --build`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stl
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: stl
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stl"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://stl:${DB_PASSWORD}@db:5432/stl
      JWT_SECRET: ${JWT_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      UPLOAD_DIR: /data/uploads
      LIVEKIT_URL: wss://${LIVE_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      PUBLIC_URL: https://${DOMAIN}
      BACKUP_DIR: /backups
    volumes:
      - uploads:/data/uploads
      - ./backups:/backups:ro

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api, livekit]
    environment:
      DOMAIN: ${DOMAIN}
      LIVE_DOMAIN: ${LIVE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

  # Backup automatico: database e foto/video nella cartella "backups" accanto a questo file.
  # Il primo parte subito, poi ogni notte alle 3. I database più vecchi di 14 giorni si cancellano da soli.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: stl
      PGDATABASE: stl
      PGPASSWORD: ${DB_PASSWORD}
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
      BACKUP_HOUR: "3"
      KEEP_DAYS: "14"
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads:/data/uploads:ro

  # Facoltativo: tiene aggiornato l'indirizzo gratuito DuckDNS se l'IP di casa cambia.
  # Si accende solo con:  docker compose --profile duckdns up -d
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    profiles: ["duckdns"]
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      TZ: Europe/Rome

volumes:
  db-data:
  uploads:
  caddy-data:
