# Configurazione del server video. Le chiavi arrivano dal file .env (LIVEKIT_KEYS).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
# Serve al servizio di registrazione delle Piazze (egress).
redis:
  address: redis:6379
logging:
  level: info
